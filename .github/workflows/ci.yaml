name: ci

on:
  push:
    branches-ignore:
      - gh-pages
      - dist
      - "renovate/**"
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
          cache: "npm"

      - name: Install dependencies
        run: npm ci
      
      - name: Build script
        run: npm run build
      
      - name: Verify build output
        run: |
          ls -la dist/
          test -f dist/index.prod.user.js || exit 1
